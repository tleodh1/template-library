<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkFlow Admin</title><style>@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#191f28;font-family:Pretendard,sans-serif}.top{height:70px;background:#fff;border-bottom:1px solid #e5e8eb;display:flex;align-items:center}.nav,.wrap{width:1080px;max-width:calc(100% - 40px);margin:auto}.nav{display:flex;align-items:center}.brand{font-size:22px;font-weight:800;color:#3182f6}.tag{margin-left:9px;background:#f2f4f6;padding:5px 8px;border-radius:8px;font-size:11px}.back{margin-left:auto;color:#6b7684;text-decoration:none}.wrap{padding:48px 0}.head h1{font-size:34px;margin:0 0 8px}.head p{color:#8b95a1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}.box{background:#fff;border:1px solid #e5e8eb;border-radius:20px;padding:27px}.box h2{margin:0 0 20px;font-size:19px}.drop{height:180px;border:1.5px dashed #c9d2dc;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fbfcfd}.drop:hover{border-color:#3182f6}.plus{width:48px;height:48px;background:#e8f3ff;color:#3182f6;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:25px}.drop b{margin-top:10px}.drop span{font-size:12px;color:#8b95a1;margin-top:6px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:18px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid #dfe3e8;border-radius:11px;padding:12px;background:#fff;font:inherit;outline:none}textarea{height:82px;resize:none}input:focus,select:focus,textarea:focus{border-color:#3182f6}.btn{width:100%;border:0;border-radius:12px;background:#3182f6;color:#fff;font-weight:700;padding:14px;margin-top:12px;cursor:pointer}.btn.secondary{background:#eef4ff;color:#3182f6}.btn:disabled{opacity:.5;cursor:not-allowed}.status{background:#f7f8fa;border-radius:11px;padding:12px 14px;color:#6b7684;font-size:13px;margin-bottom:15px;white-space:pre-line}.status.ok{background:#edf8f1;color:#16834a}.status.err{background:#fff0f0;color:#d33}.list{display:flex;flex-direction:column;gap:10px}.empty{background:#fafbfc;border-radius:14px;padding:45px 20px;text-align:center;color:#8b95a1;font-size:14px}.item{border:1px solid #edf0f2;border-radius:13px;padding:14px;display:flex;align-items:center;gap:12px}.ico{width:38px;height:38px;border-radius:10px;background:#e8f3ff;color:#3182f6;display:flex;align-items:center;justify-content:center;font-weight:800}.item b{font-size:14px}.item small{display:block;color:#8b95a1;margin-top:4px}.del{margin-left:8px;border:0;background:none;color:#b0b8c1;cursor:pointer}.hint{font-size:12px;color:#8b95a1;margin-top:12px;line-height:1.6}.loginBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.loginBtns .btn{margin-top:0}.setup{margin-bottom:22px}.setup .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:800px){.grid,.fields,.setup .row{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header class="top"><div class="nav"><div class="brand">WorkFlow</div><span class="tag">ADMIN</span><a class="back" href="../">← 홈페이지</a></div></header><main class="wrap"><div class="head"><h1>템플릿 관리</h1><p>PPT, Word, Excel과 기타 업무 양식을 등록하고 관리합니다.</p></div><div class="grid"><section class="box"><div class="setup"><h2>관리자 로그인</h2><div class="status" id="connStatus">관리자 계정을 만들거나 로그인하세요.</div><div class="row"><input id="email" type="email" placeholder="관리자 이메일"><input id="password" type="password" placeholder="비밀번호 (6자 이상)"></div><div class="loginBtns" style="margin-top:10px"><button type="button" class="btn secondary" id="signup">계정 만들기</button><button type="button" class="btn" id="login">로그인</button></div><div class="hint">첫 사용이면 계정 만들기를 누른 뒤 이메일 인증이 요구되면 인증 후 로그인하세요.</div></div><hr style="border:0;border-top:1px solid #edf0f2;margin:25px 0"><h2>새 템플릿 등록</h2><div class="status" id="status">로그인 후 파일을 등록할 수 있습니다.</div><label class="drop" for="file"><div class="plus">+</div><b id="filename">파일 선택</b><span>PPTX · DOCX · XLSX · PDF · 이미지 / 최대 50MB</span></label><input id="file" type="file" hidden accept=".ppt,.pptx,.doc,.docx,.xls,.xlsx,.pdf,.png,.jpg,.jpeg,.webp"><div class="fields"><div><label>파일 종류</label><select id="type"><option>PPT</option><option>WORD</option><option>EXCEL</option><option>OTHER</option></select></div><div><label>분류</label><input id="category" placeholder="예: IR, 보고자료"></div><div class="full"><label>템플릿명</label><input id="title" placeholder="예: IR Book Template"></div><div class="full"><label>설명</label><textarea id="description" placeholder="템플릿 설명"></textarea></div><div><label>버전</label><input id="version" value="1.0"></div></div><button type="button" class="btn" id="upload" onclick="if(window.handleUpload){window.handleUpload()}else{document.getElementById('status').className='status err';document.getElementById('status').textContent='업로드 기능을 불러오지 못했습니다. 페이지를 새로고침해 주세요.'}">템플릿 등록</button></section><section class="box"><h2>등록된 템플릿</h2><div id="list" class="list"><div class="empty">로그인 후 등록 목록이 표시됩니다.</div></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const $=id=>document.getElementById(id);const URL='https://vvduewatugzqlktxbeli.supabase.co',KEY='sb_publishable_eIbk_uxhM4qEofQKoAA3Tw_nqK9yBAd',BUCKET='templates',MANIFEST='manifest.json';let selected=null,sb=null;function msg(s,c=''){$('status').className='status '+c;$('status').textContent=s}function conn(s,c=''){$('connStatus').className='status '+c;$('connStatus').textContent=s}if(!window.supabase){conn('Supabase 연결 모듈을 불러오지 못했습니다. 새로고침해 주세요.','err');msg('업로드 모듈 로드 실패','err')}else{sb=window.supabase.createClient(URL,KEY)}async function session(){if(!sb)return null;const {data}=await sb.auth.getSession();return data.session}async function boot(){if(!sb)return;const s=await session();if(s){conn('로그인됨 · '+(s.user.email||'관리자'),'ok');msg('파일을 선택하고 정보를 입력하세요.');loadManifest()}}boot();$('signup').onclick=async()=>{if(!sb)return conn('Supabase 모듈 로드 실패. 새로고침해 주세요.','err');const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6)return conn('이메일과 6자 이상 비밀번호를 입력하세요.','err');const {data,error}=await sb.auth.signUp({email,password});if(error)return conn(error.message,'err');if(data.session){conn('계정 생성 및 로그인 완료.','ok');msg('파일을 선택하고 정보를 입력하세요.');loadManifest()}else conn('계정 생성 완료. 이메일 인증이 필요하면 인증 후 로그인하세요.','ok')};$('login').onclick=async()=>{if(!sb)return conn('Supabase 모듈 로드 실패. 새로고침해 주세요.','err');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return conn(error.message,'err');const s=await session();conn('로그인됨 · '+(s?.user?.email||'관리자'),'ok');msg('파일을 선택하고 정보를 입력하세요.');loadManifest()};$('file').onchange=()=>{selected=$('file').files[0];if(!selected)return;$('filename').textContent=selected.name;if(!$('title').value)$('title').value=selected.name.replace(/\.[^.]+$/,'');const e=selected.name.split('.').pop().toLowerCase();$('type').value=['ppt','pptx'].includes(e)?'PPT':['doc','docx'].includes(e)?'WORD':['xls','xlsx'].includes(e)?'EXCEL':'OTHER'};async function getManifest(){const {data,error}=await sb.storage.from(BUCKET).download(MANIFEST);if(error)return[];try{return JSON.parse(await data.text())}catch{return[]}}async function putManifest(items){const blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'});return sb.storage.from(BUCKET).upload(MANIFEST,blob,{upsert:true,contentType:'application/json'})}function publicUrl(path){return URL+'/storage/v1/object/public/'+BUCKET+'/'+encodeURIComponent(path).replace(/%2F/g,'/')}async function loadManifest(){if(!sb)return;const items=await getManifest();if(!items.length){$('list').innerHTML='<div class="empty">등록된 템플릿이 없습니다.</div>';return}$('list').innerHTML=items.map(x=>`<div class="item"><div class="ico">${(x.file_type||'O')[0]}</div><div><b>${esc(x.title)}</b><small>${esc(x.file_type)} · ${esc(x.category||'미분류')} · v${esc(x.version||'1.0')}</small></div><a href="${publicUrl(x.file_path)}" target="_blank" style="margin-left:auto;font-size:12px;color:#3182f6;text-decoration:none">받기</a><button type="button" class="del" onclick="removeItem('${x.id}')">삭제</button></div>`).join('')}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}window.handleUpload=async()=>{if(!sb)return msg('Supabase 연결 모듈을 불러오지 못했습니다. 새로고침해 주세요.','err');const s=await session();if(!s)return msg('먼저 관리자 계정으로 로그인하세요.','err');if(!selected)return msg('업로드할 파일을 선택하세요.','err');if(!$('title').value.trim())return msg('템플릿명을 입력하세요.','err');if(selected.size>52428800)return msg('파일은 50MB 이하만 등록할 수 있습니다.','err');$('upload').disabled=true;msg('업로드 중입니다...');const path=Date.now()+'_'+selected.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await sb.storage.from(BUCKET).upload(path,selected,{upsert:false});if(up.error){msg('업로드 실패: '+up.error.message+'\nSupabase에서 templates Storage 초기 설정이 필요합니다.','err');$('upload').disabled=false;return}const items=await getManifest();items.unshift({id:crypto.randomUUID(),title:$('title').value.trim(),description:$('description').value.trim(),file_type:$('type').value,category:$('category').value.trim(),version:$('version').value.trim()||'1.0',file_name:selected.name,file_path:path,file_size:selected.size,created_at:new Date().toISOString()});const m=await putManifest(items);if(m.error){await sb.storage.from(BUCKET).remove([path]);msg('목록 저장 실패: '+m.error.message,'err')}else{msg('등록 완료.','ok');selected=null;$('file').value='';$('filename').textContent='파일 선택';$('title').value='';$('description').value='';loadManifest()}$('upload').disabled=false};window.removeItem=async id=>{if(!confirm('이 템플릿을 삭제할까요?'))return;const items=await getManifest(),x=items.find(v=>v.id===id);if(!x)return;await sb.storage.from(BUCKET).remove([x.file_path]);const next=items.filter(v=>v.id!==id),r=await putManifest(next);if(r.error)alert(r.error.message);else loadManifest()};</script></body></html>
