<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkFlow Upload</title><style>@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#191f28;font-family:Pretendard,sans-serif}.top{height:70px;background:#fff;border-bottom:1px solid #e5e8eb;display:flex;align-items:center}.nav,.wrap{width:1080px;max-width:calc(100% - 40px);margin:auto}.nav{display:flex;align-items:center}.brand{font-size:22px;font-weight:800;color:#3182f6}.back{margin-left:auto;color:#6b7684;text-decoration:none}.wrap{padding:48px 0}.head h1{font-size:34px;margin:0 0 8px}.head p{color:#8b95a1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}.box{background:#fff;border:1px solid #e5e8eb;border-radius:20px;padding:27px}.box h2{margin:0 0 20px;font-size:19px}.status{background:#f7f8fa;border-radius:11px;padding:12px 14px;color:#6b7684;font-size:13px;margin-bottom:15px;white-space:pre-line}.status.ok{background:#edf8f1;color:#16834a}.status.err{background:#fff0f0;color:#d33}.drop{height:180px;border:1.5px dashed #c9d2dc;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fbfcfd}.drop:hover{border-color:#3182f6}.plus{width:48px;height:48px;background:#e8f3ff;color:#3182f6;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:25px}.drop b{margin-top:10px}.drop span{font-size:12px;color:#8b95a1;margin-top:6px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:18px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid #dfe3e8;border-radius:11px;padding:12px;background:#fff;font:inherit;outline:none}textarea{height:82px;resize:none}input:focus,select:focus,textarea:focus{border-color:#3182f6}.btn{width:100%;border:0;border-radius:12px;background:#3182f6;color:#fff;font-weight:700;padding:14px;margin-top:16px;cursor:pointer}.btn:disabled{opacity:.5}.list{display:flex;flex-direction:column;gap:10px}.empty{background:#fafbfc;border-radius:14px;padding:45px 20px;text-align:center;color:#8b95a1;font-size:14px}.item{border:1px solid #edf0f2;border-radius:13px;padding:14px;display:flex;align-items:center;gap:12px}.ico{width:38px;height:38px;border-radius:10px;background:#e8f3ff;color:#3182f6;display:flex;align-items:center;justify-content:center;font-weight:800}.item b{font-size:14px}.item small{display:block;color:#8b95a1;margin-top:4px}.actions{margin-left:auto;display:flex;gap:10px;align-items:center}.actions a{font-size:12px;color:#3182f6;text-decoration:none}.del{border:0;background:#fff1f1;color:#d33;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer}@media(max-width:800px){.grid,.fields{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header class="top"><div class="nav"><div class="brand">WorkFlow</div><a class="back" href="../">← 홈페이지</a></div></header><main class="wrap"><div class="head"><h1>템플릿 업로드</h1><p>파일을 선택하고 등록하면 WorkFlow에 바로 저장됩니다.</p></div><div class="grid"><section class="box"><h2>새 템플릿 등록</h2><div class="status" id="status">파일을 선택하고 정보를 입력하세요.</div><label class="drop" for="file"><div class="plus">+</div><b id="filename">파일 선택</b><span>PPTX · DOCX · XLSX · PDF · 이미지 / 최대 50MB</span></label><input id="file" type="file" hidden accept=".ppt,.pptx,.doc,.docx,.xls,.xlsx,.pdf,.png,.jpg,.jpeg,.webp"><div class="fields"><div><label>파일 종류</label><select id="type"><option>PPT</option><option>WORD</option><option>EXCEL</option><option>OTHER</option></select></div><div><label>분류</label><input id="category" placeholder="예: IR, 보고자료"></div><div class="full"><label>템플릿명</label><input id="title" placeholder="예: IR Book Template"></div><div class="full"><label>설명</label><textarea id="description" placeholder="템플릿 설명"></textarea></div><div><label>버전</label><input id="version" value="1.0"></div></div><button class="btn" id="upload" type="button">템플릿 등록</button></section><section class="box"><h2>등록된 템플릿</h2><div id="list" class="list"><div class="empty">등록된 템플릿을 불러오는 중입니다.</div></div></section></div></main><script>const URL='https://vvduewatugzqlktxbeli.supabase.co',KEY='sb_publishable_eIbk_uxhM4qEofQKoAA3Tw_nqK9yBAd',BUCKET='templates',MANIFEST='manifest.json';const $=id=>document.getElementById(id);let selected=null;function msg(s,c=''){$('status').className='status '+c;$('status').textContent=s}function encPath(p){return p.split('/').map(encodeURIComponent).join('/')}function pub(path){return URL+'/storage/v1/object/public/'+BUCKET+'/'+encPath(path)}async function getManifest(){try{const r=await fetch(pub(MANIFEST)+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return[];const j=await r.json();return Array.isArray(j)?j:[]}catch{return[]}}async function saveManifest(items){const r=await fetch(URL+'/storage/v1/object/'+BUCKET+'/'+MANIFEST,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'x-upsert':'true','Content-Type':'application/json'},body:JSON.stringify(items)});if(!r.ok)throw new Error(await r.text())}async function load(){const items=await getManifest();$('list').innerHTML=items.length?items.map(x=>`<div class="item"><div class="ico">${(x.file_type||'O')[0]}</div><div><b>${String(x.title||'')}</b><small>${String(x.file_type||'')} · ${String(x.category||'미분류')} · v${String(x.version||'1.0')}</small></div><div class="actions"><a href="${pub(x.file_path)}" target="_blank">받기</a><button class="del" type="button" onclick="removeFromList('${x.id}')">삭제</button></div></div>`).join(''):'<div class="empty">등록된 템플릿이 없습니다.</div>'}$('file').onchange=()=>{selected=$('file').files&&$('file').files[0];if(!selected)return;$('filename').textContent=selected.name;msg('파일 선택됨: '+selected.name,'ok');if(!$('title').value)$('title').value=selected.name.replace(/\.[^.]+$/,'');const e=selected.name.split('.').pop().toLowerCase();$('type').value=['ppt','pptx'].includes(e)?'PPT':['doc','docx'].includes(e)?'WORD':['xls','xlsx'].includes(e)?'EXCEL':'OTHER'};$('upload').onclick=async()=>{if(!selected)return msg('업로드할 파일을 먼저 선택하세요.','err');if(!$('title').value.trim())return msg('템플릿명을 입력하세요.','err');if(selected.size>52428800)return msg('파일은 50MB 이하만 등록할 수 있습니다.','err');$('upload').disabled=true;msg('업로드 중입니다...');try{const path=Date.now()+'_'+selected.name.replace(/[^a-zA-Z0-9._-]/g,'_');const r=await fetch(URL+'/storage/v1/object/'+BUCKET+'/'+encPath(path),{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'x-upsert':'false','Content-Type':selected.type||'application/octet-stream'},body:selected});if(!r.ok)throw new Error(await r.text());const items=await getManifest();items.unshift({id:Date.now().toString(),title:$('title').value.trim(),description:$('description').value.trim(),file_type:$('type').value,category:$('category').value.trim(),version:$('version').value.trim()||'1.0',file_name:selected.name,file_path:path,file_size:selected.size,created_at:new Date().toISOString()});await saveManifest(items);msg('등록 완료.','ok');selected=null;$('file').value='';$('filename').textContent='파일 선택';$('title').value='';$('description').value='';await load()}catch(e){msg('업로드 실패: '+(e.message||e),'err')}finally{$('upload').disabled=false}};async function removeFromList(id){const items=await getManifest();const item=items.find(x=>String(x.id)===String(id));if(!item)return;if(!confirm('"'+item.title+'" 템플릿을 삭제할까요?'))return;try{await saveManifest(items.filter(x=>String(x.id)!==String(id)));msg('삭제 완료. 홈페이지에서도 제거됩니다.','ok');await load()}catch(e){msg('삭제 실패: '+(e.message||e),'err')}}load();</script></body></html>
