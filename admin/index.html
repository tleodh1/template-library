<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WorkFlow 관리자</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header class="top"><div class="nav"><div class="brand">WorkFlow</div><a class="back" href="/">← 홈페이지</a></div></header>
  <main class="wrap">
    <section id="loginView" class="login-card" hidden>
      <div class="lock">✓</div><h1>관리자 로그인</h1>
      <p>등록된 관리자 이메일로 일회용 로그인 링크를 보내드립니다.</p>
      <label class="login-label" for="email">관리자 이메일</label>
      <input id="email" type="email" autocomplete="email" placeholder="name@example.com">
      <button class="btn" id="login" type="button">로그인 링크 받기</button>
      <div class="status" id="loginStatus">관리자만 템플릿을 등록하거나 삭제할 수 있습니다.</div>
    </section>
    <section id="adminView" hidden>
      <div class="head-row"><div class="head"><h1>템플릿 관리</h1><p>파일을 등록하면 WorkFlow에 바로 반영됩니다.</p></div><button class="logout" id="logout" type="button">로그아웃</button></div>
      <div class="grid">
        <section class="box">
          <h2>새 템플릿 등록</h2><div class="status" id="status">파일을 선택하고 정보를 입력하세요.</div>
          <label class="drop" for="file"><div class="plus">+</div><b id="filename">파일 선택</b><span>PPTX · DOCX · XLSX · PDF · 이미지 / 최대 50MB</span></label>
          <input id="file" type="file" hidden accept=".ppt,.pptx,.doc,.docx,.xls,.xlsx,.pdf,.png,.jpg,.jpeg,.webp">
          <div class="fields">
            <div><label for="type">파일 종류</label><select id="type"><option>PPT</option><option>WORD</option><option>EXCEL</option><option>OTHER</option></select></div>
            <div><label for="category">분류</label><input id="category" placeholder="예: IR, 보고자료"></div>
            <div class="full"><label for="title">템플릿명</label><input id="title" placeholder="예: IR Book Template"></div>
            <div class="full"><label for="description">설명</label><textarea id="description" placeholder="템플릿 설명"></textarea></div>
            <div><label for="version">버전</label><input id="version" value="1.0"></div>
            <div class="full thumbpick"><label for="thumbFile">대표 이미지</label><input id="thumbFile" type="file" accept="image/png,image/jpeg,image/webp"><div class="thumbhint">선택한 이미지 파일을 변환하지 않고 그대로 사용합니다.</div><div class="thumbpreview" id="thumbPreview"><img id="thumbImg" alt="대표 이미지 미리보기"></div></div>
          </div>
          <button class="btn" id="upload" type="button">템플릿 등록</button>
        </section>
        <section class="box"><h2>등록된 템플릿</h2><div id="list" class="list"><div class="empty">등록된 템플릿을 불러오는 중입니다.</div></div></section>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
