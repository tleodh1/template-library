<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkFlow Admin</title><style>@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#191f28;font-family:Pretendard,sans-serif}.top{height:70px;background:white;border-bottom:1px solid #e5e8eb;display:flex;align-items:center}.nav,.wrap{width:1080px;max-width:calc(100% - 40px);margin:auto}.nav{display:flex;align-items:center}.brand{font-size:22px;font-weight:800;color:#3182f6}.tag{margin-left:9px;background:#f2f4f6;padding:5px 8px;border-radius:8px;font-size:11px}.back{margin-left:auto;color:#6b7684;text-decoration:none}.wrap{padding:48px 0}.head h1{font-size:34px;margin:0 0 8px}.head p{color:#8b95a1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}.box{background:white;border:1px solid #e5e8eb;border-radius:20px;padding:27px}.box h2{margin:0 0 20px;font-size:19px}.drop{height:180px;border:1.5px dashed #c9d2dc;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fbfcfd}.drop:hover{border-color:#3182f6}.plus{width:48px;height:48px;background:#e8f3ff;color:#3182f6;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:25px}.drop b{margin-top:10px}.drop span{font-size:12px;color:#8b95a1;margin-top:6px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:18px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid #dfe3e8;border-radius:11px;padding:12px;background:white;font:inherit;outline:none}textarea{height:82px;resize:none}input:focus,select:focus,textarea:focus{border-color:#3182f6}.btn{width:100%;border:0;border-radius:12px;background:#3182f6;color:white;font-weight:700;padding:14px;margin-top:17px;cursor:pointer}.status{background:#f7f8fa;border-radius:11px;padding:12px 14px;color:#6b7684;font-size:13px;margin-bottom:15px}.list{background:#fafbfc;border-radius:14px;padding:45px 20px;text-align:center;color:#8b95a1;font-size:14px}.hint{font-size:12px;color:#8b95a1;margin-top:12px;line-height:1.6}@media(max-width:800px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header class="top"><div class="nav"><div class="brand">WorkFlow</div><span class="tag">ADMIN</span><a class="back" href="../">← 홈페이지</a></div></header><main class="wrap"><div class="head"><h1>템플릿 관리</h1><p>PPT, Word, Excel과 기타 업무 양식을 등록하고 관리합니다.</p></div><div class="grid"><section class="box"><h2>새 템플릿 등록</h2><div class="status">파일을 선택하고 템플릿 정보를 입력하세요.</div><label class="drop" for="file"><div class="plus">+</div><b id="filename">파일 선택</b><span>PPTX · DOCX · XLSX · PDF · 이미지</span></label><input id="file" type="file" hidden><div class="fields"><div><label>파일 종류</label><select id="type"><option>PPT</option><option>WORD</option><option>EXCEL</option><option>OTHER</option></select></div><div><label>분류</label><input placeholder="예: IR, 보고자료"></div><div class="full"><label>템플릿명</label><input id="title" placeholder="예: IR Book Template"></div><div class="full"><label>설명</label><textarea placeholder="템플릿 설명"></textarea></div><div><label>버전</label><input value="1.0"></div></div><button class="btn" type="button">템플릿 등록</button><div class="hint">파일 저장소 연결이 완료되면 이 화면에서 등록한 자료가 메인 WorkFlow에 자동 반영됩니다.</div></section><section class="box"><h2>등록된 템플릿</h2><div class="list">아직 등록된 템플릿이 없습니다.<br>왼쪽에서 첫 파일을 등록하세요.</div></section></div></main><script>const f=document.getElementById('file'),n=document.getElementById('filename'),t=document.getElementById('type'),title=document.getElementById('title');f.onchange=()=>{const x=f.files[0];if(!x)return;n.textContent=x.name;if(!title.value)title.value=x.name.replace(/\.[^.]+$/,'');const e=x.name.split('.').pop().toLowerCase();t.value=['ppt','pptx'].includes(e)?'PPT':['doc','docx'].includes(e)?'WORD':['xls','xlsx'].includes(e)?'EXCEL':'OTHER'};</script></body></html>
